# =============================================
# CONFIGURAÇÕES DO BANCO DE DADOS - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestao_veiculos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# CONFIGURAÇÕES JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =============================================
# CONFIGURAÇÕES DO SERVIDOR
# =============================================
server.port=8080
spring.application.name=gestao-veiculos

# =============================================
# CONFIGURAÇÕES DE LOG
# =============================================
logging.level.com.gestaoveiculos=DEBUG
logging.level.org.springframework.web=INFO
